<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Личный кабинет студента НАТК</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="form-container">
        <h1 class="form-header">Вход</h1>

        <form class="input-container" action="profile.html" method="get">
            <label for="login">Логин</label>
            <input type="text" id="login" name="login" placeholder="Введите логин"
                autocomplete="username" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль"
                autocomplete="current-password" minlength="6" required>

            <a class="forgot-password" href="#">Забыли пароль?</a>

            <button class="submit" type="submit">Войти</button>

            <p class="signup">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        </form>
    </main>
</body>

</html>
